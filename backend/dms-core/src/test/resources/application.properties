# Test-only overrides (merged over src/main/resources/application.yml).
# The workflow SLA scheduler would otherwise run in every cached Spring
# context against the shared test database and race the tests that drive it
# through WorkflowSlaService.runOnce().
dms.workflow.sla.enabled=false

# Likewise the notification dispatcher: off in every test context so it never
# races the tests. The notification ITs drive NotificationDispatcher.runOnce()
# directly (and point spring.mail.* at GreenMail).
dms.notification.dispatcher.enabled=false

# The home dashboard is otherwise served from Redis for 60 seconds per person. A test that reads it,
# does something, and reads it again (WorkflowDocumentAccessIT: submit, approve) would get the first
# answer back and miss its own change. The cache has its own tests (DashboardCacheTest,
# DashboardCacheRedisTest), which build it directly and are unaffected by this.
dms.dashboard.cache-seconds=0
