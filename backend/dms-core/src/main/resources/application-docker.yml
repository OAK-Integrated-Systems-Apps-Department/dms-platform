spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/dms_core_db
  rabbitmq:
    host: rabbitmq

  data:
    redis:
      host: redis

  mail:
    host: mailpit
    port: 1025
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8081/realms/oak-dms
          jwk-set-uri: http://keycloak:8080/realms/oak-dms/protocol/openid-connect/certs

keycloak:
  admin:
    server-url: http://keycloak:8080
  auth:
    # Browser-facing issuer/jwk-set-uri above stay on localhost:8081
    # (resolved by the browser / used for token validation), but this
    # server-to-server call from dms-core to Keycloak's token endpoint
    # goes over the internal docker network, same as keycloak.admin above.
    server-url: http://keycloak:8080
