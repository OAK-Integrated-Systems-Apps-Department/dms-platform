spring:
  application:
    name: dms-core

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/dms_dev}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:password}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc.batch_size: 50
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:dms}
    password: ${RABBITMQ_PASSWORD:changeme}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 1000
          max-attempts: 5
          multiplier: 2

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/oak-dms}
          jwk-set-uri: ${KEYCLOAK_JWK_SET_URI:http://localhost:8081/realms/oak-dms/protocol/openid-connect/certs}

  # Used only by PasswordResetService's own reset-link emails - unrelated
  # to Keycloak's SMTP config (infra/local/docker-compose.yml's mailpit
  # service / KEYCLOAK_SMTP_* env vars), which is a separate SMTP client
  # inside Keycloak itself for its own account-creation/verify-email mail.
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1026}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

keycloak:
  admin:
    server-url: ${KEYCLOAK_SERVER_URL:http://localhost:8081}
    realm: ${KEYCLOAK_REALM:oak-dms}
    client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:dms-core-admin}
    client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:changeme}
  auth:
    # Deliberately separate from keycloak.admin above: this identifies the
    # public "oak-dms-web" client (no secret) that end-user credentials are
    # exchanged under - see KeycloakAuthProperties for why these must not
    # be merged.
    server-url: ${KEYCLOAK_SERVER_URL:http://localhost:8081}
    realm: ${KEYCLOAK_REALM:oak-dms}
    client-id: ${KEYCLOAK_WEB_CLIENT_ID:oak-dms-web}
    connect-timeout-ms: ${KEYCLOAK_AUTH_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${KEYCLOAK_AUTH_READ_TIMEOUT_MS:5000}

app:
  branding:
    # Single source of truth for the product's customer-facing display
    # name - see BrandingProperties. Every place that used to hardcode
    # "Oak DMS" as a literal string (PasswordResetService's emails,
    # OpenApiConfig's title) reads this instead now, so a rebrand is ever
    # only a one-line config change. Deliberately separate from the
    # frontend's own lib/app-config.ts APP_NAME constant - the two run in
    # different processes/languages and have no shared config source, so
    # keep them in sync by hand if the brand name changes.
    product-name: ${PRODUCT_NAME:Ledger}
  cors:
    # Comma-separated exact origins - see SecurityConfig for why this can
    # never be a wildcard now that CORS allows credentials.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  auth:
    cookie:
      # true works for both a real HTTPS deployment and local dev against
      # http://localhost (browsers treat localhost as a secure context).
      secure: ${AUTH_COOKIE_SECURE:true}
      same-site: ${AUTH_COOKIE_SAME_SITE:Lax}
      domain: ${AUTH_COOKIE_DOMAIN:}
      path: /
  # Origin the frontend is actually served from, used only to build the
  # link inside password-reset emails (PasswordResetService) - e.g.
  # "${frontend-base-url}/update-password?token=...". Deliberately
  # separate from app.cors.allowed-origins: that's a list (CORS may allow
  # several origins), this is the one canonical origin a person should
  # land on.
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:3000}
  password-reset:
    token-ttl-minutes: ${PASSWORD_RESET_TOKEN_TTL_MINUTES:30}
    mail-from: ${PASSWORD_RESET_MAIL_FROM:no-reply@oakdms.local}

dms:
  outbox:
    relay-interval-ms: ${OUTBOX_RELAY_INTERVAL_MS:2000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    root: INFO
    com.oak.dms: ${LOG_LEVEL:INFO}
    org.hibernate.SQL: ${SQL_LOG_LEVEL:WARN}
