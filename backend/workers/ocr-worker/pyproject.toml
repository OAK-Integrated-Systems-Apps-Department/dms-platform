[project]
name = "ocr-worker"
version = "0.1.0"
description = "Oak DMS OCR & Scanning microservice (OS-FR-001..006, OS-NFR-001..006)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "aio-pika>=9.4",
    "pika>=1.3",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "minio>=7.2",
    "pillow>=10.4",
    "pymupdf>=1.24",
    "docling>=2.0",
    # paddleocr>=3 no longer pulls in its own inference engine -- paddlepaddle
    # (CPU) and paddlepaddle-gpu are separate PyPI packages, unlike torch's
    # single-name/local-version-tag scheme, so this stays CPU-only with no
    # special index needed (see Dockerfile's torch comment for the case
    # where that *isn't* true).
    "paddlepaddle>=3.0",
    "paddleocr>=2.9",
    # Selectable OCR field extraction's "language" field: ISO 639-1 codes
    # directly, pure-Python, no model download -- no existing dependency
    # here does language detection at all.
    "langdetect>=1.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3.14",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
