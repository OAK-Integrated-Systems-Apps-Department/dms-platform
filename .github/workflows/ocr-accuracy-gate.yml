# The OCR accuracy gate (production prompt section 5).
#
# Fails the build when either of two things is true of the SYNTHETIC set:
#
#   1. field accuracy dropped below the recorded baseline, or
#   2. any document failed to produce a searchable PDF rendition.
#
# Both checks live in `eval/compare.py`, which is also what a developer
# runs locally -- CI calls the same code with the same arguments rather
# than reimplementing the rule, so the gate cannot pass here and fail
# there.
#
# WHY SYNTHETIC ONLY. The real set is the one that answers OS-NFR-001 and
# it cannot run here: its documents are customer invoices carrying names,
# bank details and amounts, and they are gitignored for that reason. CI
# never sees them. What the synthetic set can do is **veto** -- it is
# generated and labelled by the same process it measures, so an
# improvement on it justifies nothing, but a regression on it means
# something structural broke and that is worth blocking a merge for.
#
# The real-set gate is run by a human before a release. See
# "Before a release" in backend/workers/ocr-worker/README.md.
#
# ----------------------------------------------------------------------
# RUNNER REQUIREMENTS -- measured, not estimated
# ----------------------------------------------------------------------
# A standard GitHub-hosted `ubuntu-latest` runner is 4 vCPU / 16 GB RAM /
# 14 GB free SSD. Against that:
#
#   | resource    | this job needs                      | runner has |
#   |-------------|-------------------------------------|------------|
#   | peak memory | 3.76 GiB (one inference process)    | 16 GB      |
#   | disk        | ~4.4 GB image + ~0.65 GB model      | 14 GB      |
#   |             |   weights + ~0.7 GB generated corpus|            |
#   | wall clock  | 2962 s of inference alone, measured | 6 h limit  |
#
# Memory and disk are comfortable. **Time is why this does not run on
# every push.** 117 documents of real CPU inference took 49 minutes on a
# developer machine faster than a hosted runner; with the image build and
# the model download on top, budget 65-90 minutes. That is tolerable
# nightly and on the way into `main`, and intolerable as the feedback
# loop on an ordinary commit.
#
# So: pull requests INTO main, a nightly run, and manual dispatch. Day to
# day, a developer gets the unit tests from the repo's normal test job in
# seconds; this job is the thing that stands between a regression and the
# release branch.
#
# If this is ever moved to a self-hosted runner, the one number that
# matters is **RAM per concurrent job**: ~3.8 GiB per inference process,
# and `OCR_WORKER_PROCESSES` is 1 here. Two jobs on one 8 GB box will OOM.

name: OCR accuracy gate

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/workers/ocr-worker/**'
      - '.github/workflows/ocr-accuracy-gate.yml'
  schedule:
    # 02:30 UTC daily. Catches a regression that reached `develop` without
    # going through a PR into main, while nobody is waiting on it.
    - cron: '30 2 * * *'
  workflow_dispatch:

concurrency:
  group: ocr-accuracy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    # Generous on purpose: a gate that times out is a gate people learn
    # to ignore. 150 minutes against a measured 65-90.
    timeout-minutes: 150

    steps:
      - uses: actions/checkout@v4

      - name: Reclaim disk
        # The image is ~4.4 GB and the corpus is generated to disk. A
        # hosted runner ships with several GB of Android SDK, .NET and
        # Haskell toolchains this job will never touch.
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc || true
          df -h /

      - name: Cache model weights
        # ~650 MB of PaddleOCR and orientation weights, fetched from the
        # PaddleX model server and the HF Hub on first use. They are NOT
        # baked into the image (see the Dockerfile's note on the two
        # mounts), so without this every run re-downloads them -- slower,
        # and a third-party outage becomes a red build on a change that
        # is fine.
        #
        # Keyed on the Dockerfile and requirements: a model version only
        # ever changes through one of those.
        uses: actions/cache@v4
        with:
          path: ocr-model-cache
          key: ocr-models-${{ runner.os }}-${{ hashFiles('backend/workers/ocr-worker/Dockerfile', 'backend/workers/ocr-worker/pyproject.toml') }}

      - name: Prepare the cache directories
        # Created with the image's own uid so the container can write
        # through the bind mount on a cache miss.
        run: |
          mkdir -p ocr-model-cache/paddlex ocr-model-cache/huggingface
          sudo chown -R 1000:1000 ocr-model-cache

      - name: Build the worker image
        # The same Dockerfile production ships. Building it here is also
        # the only thing that proves the image still builds.
        run: |
          docker build \
            -t ocr-worker-ci:${{ github.sha }} \
            backend/workers/ocr-worker

      - name: Unit tests
        run: |
          docker run --rm \
            -v "$PWD:/repo" -w /repo/backend/workers/ocr-worker \
            -e PYTHONPATH=/repo/backend/workers/ocr-worker/src:/repo/backend/workers/ocr-worker \
            ocr-worker-ci:${{ github.sha }} \
            python -m pytest tests -q

      - name: Label sanity check
        # Cheap, and it is the ruler. A malformed label does not fail
        # loudly -- it scores the pipeline wrong, quietly, in the
        # direction of "the pipeline is broken". There are no real labels
        # in CI, so this only ever checks the synthetic ones, which is
        # still enough to catch a schema change that invalidates them.
        run: |
          docker run --rm \
            -v "$PWD:/repo" -w /repo/backend/workers/ocr-worker \
            -e PYTHONPATH=/repo/backend/workers/ocr-worker/src:/repo/backend/workers/ocr-worker \
            ocr-worker-ci:${{ github.sha }} \
            python -m eval.check_labels

      - name: Run the synthetic evaluation set
        env:
          # Nothing is running for the guard to interrogate -- there is no
          # worker container and no database in this job. The guard
          # already treats "could not ask" as "not stale" rather than as
          # a failure, and this says so explicitly so the log is honest
          # about which checks ran.
          OCR_SKIP_STALENESS_CHECK: '1'
        run: |
          docker run --rm \
            -v "$PWD:/repo" -w /repo/backend/workers/ocr-worker \
            -v "$PWD/ocr-model-cache/paddlex:/home/oakdms/.paddlex" \
            -v "$PWD/ocr-model-cache/huggingface:/home/oakdms/.cache/huggingface" \
            -e PYTHONPATH=/repo/backend/workers/ocr-worker/src:/repo/backend/workers/ocr-worker \
            -e OCR_SKIP_STALENESS_CHECK \
            ocr-worker-ci:${{ github.sha }} \
            python -m eval.run --set synthetic --report-name ci-candidate

      - name: Gate against the recorded baseline
        # Exit 1 on: synthetic field accuracy below baseline beyond
        # tolerance, OR any searchable-PDF rendition failure. The
        # tolerance absorbs PaddleOCR's CPU jitter in the last decimal and
        # is far too small to hide a real regression -- see compare.py.
        run: |
          docker run --rm \
            -v "$PWD:/repo" -w /repo/backend/workers/ocr-worker \
            -e PYTHONPATH=/repo/backend/workers/ocr-worker/src:/repo/backend/workers/ocr-worker \
            ocr-worker-ci:${{ github.sha }} \
            python -m eval.compare \
              eval/reports/synthetic-baseline.json \
              eval/reports/ci-candidate.json

      - name: Upload the candidate report
        # Always, including on failure -- the report IS the explanation of
        # why the gate failed, and a failed run that discards it just
        # means someone has to reproduce an hour-long job to find out.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ocr-eval-report-${{ github.sha }}
          path: |
            backend/workers/ocr-worker/eval/reports/ci-candidate.json
            backend/workers/ocr-worker/eval/reports/ci-candidate.md
          retention-days: 30
