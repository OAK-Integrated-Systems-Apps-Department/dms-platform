# SonarQube analysis for the Next.js frontend.
#
# A separate project from the backend (oak-dms-backend). One project key can
# only be written by one scanner run, and the backend is analysed by the
# Maven scanner - pointing both at the same key would make each run erase
# the other's findings.
#
# Run:     see infra/sonarqube/README.md
# Server:  SONAR_HOST_URL / SONAR_TOKEN come from the environment, never
#          from this file - a token is a credential.

sonar.projectKey=oak-dms-frontend
sonar.projectName=Oak DMS - frontend

# Paths are relative to this file, which is the scanner's working directory.
sonar.sources=app,components,config,hooks,lib,stores,types,proxy.ts
sonar.sourceEncoding=UTF-8

# Not analysed, and each for its own reason:
#   node_modules  - other people's code; nothing here can fix it
#   .next         - build output, regenerated every run
#   *.config.*    - tool configuration, not application logic
#   public        - static assets, no code
sonar.exclusions=node_modules/**,.next/**,out/**,public/**,**/*.config.js,**/*.config.mjs,**/*.config.ts,**/*.d.ts

# No coverage is reported because the frontend has no test runner yet -
# package.json has lint, typecheck and build, but no `test`. Sonar will show
# 0% coverage, which is accurate rather than missing. When a runner is added,
# point this at its lcov output and delete this comment:
# sonar.javascript.lcov.reportPaths=coverage/lcov.info
