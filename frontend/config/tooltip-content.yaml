# Tooltip copy for the whole app, in one place.
#
# Organize by feature area / page, then a descriptive key. Reference from
# components with `getTooltip("users.actions.view")` (see lib/tooltips.ts).
#
# After editing this file, regenerate the typed lookup module with:
#   bun run gen:tooltips
# (this also runs automatically before `dev` and `build`)

users:
  actions:
    view: View
    edit: Edit
    resetPassword: Reset password
    activate: Activate
    deactivate: Deactivate
    delete: Delete
    impersonate: Act as this user
  pending:
    resetPasswordDisabled: This user hasn't set up their account yet
    deactivateDisabled: This user hasn't set up their account yet
    impersonateDisabled: This user isn't active
  tenantAdmin:
    deleteDisabled: The tenant admin account can't be deleted
    deactivateDisabled: The tenant admin account can't be deactivated

roles:
  actions:
    view: View
    edit: Edit
    activate: Activate
    deactivate: Deactivate
    delete: Delete


permissions:
  actions:
    view: View
    edit: Edit
    delete: Delete
# OCR & review. Two screens share this vocabulary -- the upload form's
# per-field badges and the review screen's field cards describe the SAME
# five extraction statuses, so their wording lives together here rather
# than drifting apart in two components.
documents:
  ocr:
    badge: OCR will try to read this field off the document
    rerunField: Run OCR again for just this field
    rerunAll: Run OCR again for every selected field
    confidence: How sure OCR is of this reading. Below 60% it is flagged for a human to check
  status:
    extracted: OCR read this off the document and is confident in it
    lowConfidence: OCR read this, but is not confident. Check it against the page before relying on it
    notFound: OCR looked for this and found nothing on the document
    notExtractable: Not something a document states -- your organisation assigns it, so OCR never looks for it
    notExtractableMandatory: Required, but not something a document states. Type it in -- accepting cannot fill it
    defaulted: Nothing on the page said this, so your tenant's default was applied
    accepted: You confirmed OCR's value for this field
    corrected: You changed this value. The original is kept for accuracy reporting
  review:
    accept: Confirm OCR's value is correct
    acceptEmptyMandatory: This field is required and empty -- accepting agrees it is empty, which will not clear it from the queue. Type a value instead
    edit: Type the correct value yourself
    reExtract: Draw a box on the page to re-read this field from it
    highlight: Where on the page OCR read this value. Click it to jump to that field
    saveDisabled: Accept or correct at least one field first
    save: Record your decisions. The document leaves the queue once nothing is outstanding
