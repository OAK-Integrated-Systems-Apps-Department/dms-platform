# Overlay for `phase1_closeout_verification.py timeout` (Phase 1 open item #1).
#
#   docker compose -f docker-compose.yml -f docker-compose.closeout-timeout.yml up -d ocr-worker
#
# Restore with: docker compose -f docker-compose.yml up -d ocr-worker
#
# A 1s/page budget fails every scanned document by design -- this is a
# fault-injection setting, never one to leave running.
services:
  ocr-worker:
    environment:
      # A 1-page document gets 5 + 1x1 = 6s, hard deadline 11s.
      #
      # That is comfortably enough for a native-text PDF (1.3-2.3s in the
      # Phase 1 run -- the check's own follow-up document, which must still
      # succeed) and nowhere near enough for a 1-page image-only PDF, which
      # needs ~20s of real PaddleOCR. So the same settings produce both
      # halves of the check: one document times out, the next one works.
      #
      # The DIFFERENCE is the point: for these same settings the
      # pre-close-out uniform ceiling would have been
      # 5 + OCR_MAX_PAGES(50) x 1 = 55s for that same one-page document,
      # because it was sized from ocr_max_pages rather than from the real
      # page count.
      OCR_TIMEOUT_BASE_S: "5"
      OCR_TIMEOUT_PER_PAGE_S: "1"
      OCR_TIMEOUT_HARD_GRACE_S: "5"
