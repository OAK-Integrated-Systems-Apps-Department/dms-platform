# Local development stack for dms-core. Production topology (Helm/RKE2/
# Rancher, managed Postgres with Barman backups, Ceph/Rook object storage,
# OpenBao secrets) lives under the other infra/ subdirectories - this
# compose file is intentionally dev-only.
#
# Secrets: nothing below is hardcoded plaintext. Values come from
# infra/secrets/dms-core.secrets.env, which is generated on demand by:
#     scripts/openbao-decrypt-secrets.sh
# from the committed ciphertext in infra/secrets/dms-core.secrets.enc.env
# (encrypted with OpenBao's Transit engine - see scripts/openbao-encrypt-secrets.sh).
# The plaintext file is gitignored and should be deleted after `docker compose up`.
#
# Public host: every browser-facing URL below (Keycloak's KC_HOSTNAME and
# token issuer, the web client's redirect URIs/web origins, dms-core's CORS
# origin and email links, the frontend's API/Keycloak URLs) is built from
# ONE variable, PUBLIC_HOST - the hostname or IP a browser uses to reach
# this machine. Defaults to localhost. To deploy on another machine, set it
# once in infra/local/.env (Compose reads that file automatically):
#     PUBLIC_HOST=192.168.1.50
# then `docker compose up -d --force-recreate`. Nothing else needs editing -
# keycloak-bootstrap re-applies the web client's URLs on every run, so an
# already-imported realm picks up the new host too.
# Plain-HTTP caveat: browsers only send Secure cookies over plain HTTP to
# localhost, so on any other host without HTTPS also set
#     AUTH_COOKIE_SECURE=false
# in the same file (never do that behind real HTTPS).

x-secrets-env: &secrets-env
  env_file:
    - ../secrets/dms-core.secrets.env

services:
  postgres:
    image: postgres:18-alpine
    container_name: oakdms-postgres
    # Memory ceiling, mostly page cache the kernel reclaims under pressure. 3g rather than the
    # 1.5g it had: dashboard scans over a few million documents do not fit in less and
    # then run from disk. The -c settings tell Postgres what it has - the defaults
    # (128MB of shared buffers, 4MB of sort memory) assume a much smaller machine.
    mem_limit: 3g
    command: ["postgres", "-c", "shared_buffers=512MB", "-c", "effective_cache_size=2GB",
              "-c", "work_mem=16MB", "-c", "maintenance_work_mem=256MB"]
    <<: *secrets-env
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: oakdms-rabbitmq
    # Memory ceiling.
    mem_limit: 1g
    <<: *secrets-env
    environment:
      RABBITMQ_DEFAULT_USER: dms
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - "5672:5672" # AMQP
      - "15672:15672" # management UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: oakdms-redis
    # Memory ceiling.
    mem_limit: 512m
    <<: *secrets-env
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Local dev-only fake mail server: catches every email Keycloak sends
  # (verify-email, password reset) instead of trying to deliver it
  # anywhere real. Web UI at http://localhost:8026 to actually read them -
  # this is why account-creation/reset-password emails never arrived
  # before: nothing was listening on the SMTP port Keycloak was
  # configured to use. Do NOT point production Keycloak's smtpServer at
  # this container - swap in a real SMTP relay/provider for that.
  mailpit:
    image: axllent/mailpit:latest
    container_name: oakdms-mailpit
    # Memory ceiling.
    mem_limit: 128m
    ports:
      - "8026:8025" # web UI (8025 is taken locally by dms-core sometimes; keeping 8026 to avoid clashing)
      - "1026:1025" # SMTP - matches the realm's smtpServer.port below
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8025/api/v1/info"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    container_name: oakdms-keycloak
    command: ["start-dev", "--import-realm"]
    # Keycloak sizes its heap from what it can see (70%, half of it up front) - uncapped,
    # that was ~4 GB of Docker Desktop's VM. See the clamav service's note.
    mem_limit: 1536m
    <<: *secrets-env
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak_db
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      # Keycloak needs to know its own externally-reachable address to build
      # links (e.g. the verify-email/update-password action link) that a
      # browser can actually open. Without this, it derives the link's host
      # from whatever Host header triggered the request - which for
      # execute-actions-email is dms-core/keycloak-bootstrap calling over
      # the internal docker network as "keycloak:8080", producing an
      # unreachable link. hostname-strict=false lets internal callers keep
      # using the "keycloak:8080" service name for the request itself; it
      # only stops KC_HOSTNAME from being used to reject those requests -
      # generated links always use KC_HOSTNAME regardless.
      KC_HOSTNAME: http://${PUBLIC_HOST:-localhost}:8081
      KC_HOSTNAME_STRICT: "false"
      # Substituted into oak-dms-realm.json's ${OAK_DMS_WEB_URL} placeholders
      # at first import (redirectUris/webOrigins of the oak-dms-web client).
      OAK_DMS_WEB_URL: http://${PUBLIC_HOST:-localhost}:3000
    ports:
      - "8081:8080"
    volumes:
      - ./keycloak/oak-dms-realm.json:/opt/keycloak/data/import/oak-dms-realm.json:ro
    depends_on:
      postgres:
        condition: service_healthy

  # One-shot init job: grants dms-core-admin's service account the
  # manage-users role, the one piece of setup a realm export can't express
  # (see infra/keycloak/README.md). Runs once per stack start and exits;
  # dms-core waits for it to complete successfully before starting, so
  # user-management calls never race against an ungranted permission.
  keycloak-bootstrap:
    image: alpine:latest
    container_name: oakdms-keycloak-bootstrap
    entrypoint: /bin/sh
    command: ["/bootstrap/bootstrap.sh"]
    <<: *secrets-env
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_BOOTSTRAP_ADMIN_USER: admin
      KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KEYCLOAK_REALM: oak-dms
      KEYCLOAK_ADMIN_CLIENT_ID: dms-core-admin
      # Re-applied to the oak-dms-web client on every run - see bootstrap.sh's
      # web client URLs section for why the realm import alone isn't enough.
      KEYCLOAK_WEB_CLIENT_ID: oak-dms-web
      KEYCLOAK_WEB_CLIENT_URL: http://${PUBLIC_HOST:-localhost}:3000
      # Platform superadmin. The realm file creates the account with no
      # credential; bootstrap.sh sets this one only if it has none yet, so a
      # password changed in the UI survives every later restart.
      KEYCLOAK_SUPERADMIN_USERNAME: ${KEYCLOAK_SUPERADMIN_USERNAME:-superadmin@gmail.com}
      KEYCLOAK_SUPERADMIN_PASSWORD: ${KEYCLOAK_SUPERADMIN_PASSWORD:-SuperAdmin123@}
      # false here only: a dev machine recreates this realm often and the
      # change-password prompt on every fresh volume is pure friction.
      # Production leaves it at the default (true).
      KEYCLOAK_SUPERADMIN_PASSWORD_TEMPORARY: ${KEYCLOAK_SUPERADMIN_PASSWORD_TEMPORARY:-false}
      # Re-applied on every bootstrap run - see bootstrap.sh's SMTP config
      # section for why this can't just live in oak-dms-realm.json alone.
      KEYCLOAK_SMTP_HOST: mailpit
      KEYCLOAK_SMTP_PORT: "1025"
      KEYCLOAK_SMTP_FROM: no-reply@oakdms.local
      KEYCLOAK_SMTP_FROM_DISPLAY_NAME: Oak DMS
      KEYCLOAK_SMTP_AUTH: "false"
      KEYCLOAK_SMTP_SSL: "false"
      KEYCLOAK_SMTP_STARTTLS: "false"
    volumes:
      - ../keycloak/bootstrap.sh:/bootstrap/bootstrap.sh:ro
    depends_on:
      keycloak:
        condition: service_started

  # Optional, standalone S3-compatible backend for exercising
  # S3ObjectStorageAdapter against a real server without AWS/MinIO - see
  # docs/storage-architecture.md and SeaweedFsDocumentUploadIT. Not a
  # dependency of dms-core (which defaults to STORAGE_PROVIDER=FILE_SYSTEM):
  # register a StorageLocation pointing at this endpoint to use it, e.g.
  #   provider=S3, endpoint=http://localhost:8333, bucket=dms-seaweedfs-test,
  #   pathStyleAccess=true, credentialRef=<see .env.example>
  # No SeaweedFS-specific code exists anywhere in the Java application -
  # S3ObjectStorageAdapter talks to it exactly the way it talks to AWS S3
  # or MinIO, via endpointOverride()/forcePathStyle() only.
  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: oakdms-seaweedfs
    # Memory ceiling.
    mem_limit: 1g
    # Credentials never live in this committed file (see .env.example) -
    # the S3 identity config SeaweedFS itself needs (-s3.config) is
    # generated from env vars at container start, into a location inside
    # the named volume below so it isn't lost between restarts.
    #
    # Deliberately env_file only, no environment: entry for these two
    # variables: an environment: value takes precedence over env_file for
    # the same key, so a "${SEAWEEDFS_S3_ACCESS_KEY:-changeme}"-style
    # fallback here would silently WIN over the real value env_file loads
    # from the root .env (Compose's own ${...} substitution for
    # environment: never reads that file - only env_file does). Left
    # unset in .env, this container simply starts with no working
    # credential (S3 auth rejects everything) rather than a functioning
    # "changeme" fallback baked into a committed file.
    env_file:
      - path: ../../.env
        required: false
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        cat > /data/s3_config.json <<CONFIG
        {
          "identities": [
            {
              "name": "dms-local",
              "credentials": [
                {"accessKey": "$$SEAWEEDFS_S3_ACCESS_KEY", "secretKey": "$$SEAWEEDFS_S3_SECRET_KEY"}
              ],
              "actions": ["Read", "Write", "List", "Tagging", "Admin"]
            }
          ]
        }
        CONFIG
        exec weed server -dir=/data -s3 -s3.port=8333 -s3.config=/data/s3_config.json
    ports:
      - "8333:8333" # S3 API - the only port this stack's other services need
      - "8888:8888" # Filer HTTP API - browsable directory listing for manual local checks only
    volumes:
      # Persists both the actual object data and the generated s3_config.json
      # across container restarts/recreates - see requirement 5/10 below.
      - seaweedfs_data:/data
    healthcheck:
      # A plain TCP check, not an HTTP one: the S3 API legitimately answers
      # unauthenticated requests with 403 once it's up, and both `wget
      # --spider` and plain `wget` treat that as a failure (non-2xx),
      # which would report "unhealthy" even while genuinely serving
      # requests correctly. `nc -z` only proves something is listening -
      # exactly what's needed here. 127.0.0.1, not localhost: this image's
      # S3 API only binds IPv4, and this container resolves "localhost" to
      # ::1 first, producing a false negative against the IPv6 loopback.
      test: ["CMD", "nc", "-z", "127.0.0.1", "8333"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Malware scanning engine for the ingestion scan gate (com.oak.dms.scanning,
  # see docs/scanning-architecture.md) - clamd, spoken to over TCP with the
  # INSTREAM protocol by ClamAvScanAdapter. clamav-debian rather than
  # clamav/clamav: the latter publishes amd64 only, the former is multi-arch
  # (Apple Silicon included). Same upstream release.
  #
  # Signature updates (VMSBDI-FR-006 / NFR-002): the image's own /init runs
  # freshclam as a daemon next to clamd, checking FRESHCLAM_CHECKS times a
  # day. If an update fails, clamd keeps scanning with the last good
  # definitions - ClamAV's own behaviour, no application code involved.
  # clamd/freshclam settings are applied by /init from CLAMD_CONF_<Key>/
  # FRESHCLAM_CONF_<Key> env vars; a mounted freshclam.conf "Checks" line
  # would be ignored (/init passes --checks explicitly).
  clamav:
    image: clamav/clamav-debian:1.4.3
    container_name: oakdms-clamav
    <<: *secrets-env
    # Signatures take ~1.5 GB in memory, more while a new set loads. Capped (like every
    # large service here) so the stack can't exhaust Docker Desktop's VM - when it did,
    # the whole VM froze mid-upload rather than one container being restarted.
    mem_limit: 3g
    environment:
      FRESHCLAM_CHECKS: "12" # every 2 hours
      # Kept >= dms.scanning.clamav.segment-bytes (2000 MB), otherwise clamd
      # answers "INSTREAM size limit exceeded" for a segment dms-core sends.
      # clamd scans at most 2147483645 bytes of any one stream whatever
      # MaxFileSize says (it logs "File size limit set to 2147483645"), hence
      # 2047M - larger files arrive as several overlapping segments.
      # MaxScanSize is the total read from inside archives, so it stays higher; keep it
      # (and MaxFiles) equal to dms.scanning.clamav.archive-scan-bytes / -files - a ZIP
      # past either is unpacked by dms-core and sent to clamd file by file.
      CLAMD_CONF_StreamMaxLength: 2047M
      CLAMD_CONF_MaxFileSize: 2047M
      CLAMD_CONF_MaxScanSize: 4000M
      # ZIP uploads: clamd opens every archive (nested ones too) and scans each file in it.
      # Anything it can't finish - more than MaxFiles, nested deeper than MaxRecursion,
      # past MaxScanSize/MaxScanTime - is flagged Heuristics.Limits.Exceeded, and a
      # password-protected archive Heuristics.Encrypted.*; dms-core treats both as
      # unscannable (ClamAvScanAdapter), never as clean. MaxScanTime matches the 900 s
      # scan timeout so a large file isn't cut short.
      CLAMD_CONF_AlertExceedsMax: "yes"
      CLAMD_CONF_AlertEncryptedArchive: "yes"
      CLAMD_CONF_MaxScanTime: "900000"
    ports:
      - "3310:3310" # clamd - for a host-run dms-core (dms.scanning.clamav.host=localhost)
    volumes:
      # The signature database - persisted so a restart doesn't re-download
      # ~300MB of definitions before clamd can start.
      - clamav_db:/var/lib/clamav
    healthcheck:
      # The image's own check: PING -> PONG on 3310.
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 5
      # The first start downloads the full signature database before clamd
      # listens - several minutes on a fresh volume.
      start_period: 600s

  # Office previews: converts Word/PowerPoint/OpenDocument/RTF/Visio files to
  # PDF (LibreOffice inside Gotenberg) so they can be shown in the browser -
  # see dms-core's DocumentRenditionService. Internal only: no ports, and the
  # Chromium routes (which fetch URLs) are switched off; only dms-core calls it.
  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: oakdms-gotenberg
    command:
      - gotenberg
      - --chromium-disable-routes=true
      - --api-timeout=90s
      - --libreoffice-auto-start=true
      - --log-level=warn
    # LibreOffice can use a lot of memory on a large or malformed file - cap it
    # so a bad upload can't starve the rest of the server. A conversion that
    # hits the limit fails (the preview says so); the container restarts.
    mem_limit: 2g
    cpus: 2
    pids_limit: 256
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  dms-core:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: oakdms-core
    # The JVM takes up to 75% of what it can see (backend/Dockerfile) - capped, ~1.9 GB of
    # heap. Uploads stream through it, never held in memory, whatever their size.
    mem_limit: 2560m
    env_file:
      - ../secrets/dms-core.secrets.env
      # Root .env (repo root, gitignored - see .env.example) - loaded here
      # IN ADDITION to the secrets file above, specifically so a locally
      # registered StorageLocation's STORAGE_CRED_<ref>_ACCESS_KEY/
      # _SECRET_KEY pair (see S3ObjectStorageAdapter#resolveCredentials)
      # reaches this container too. Those variable names are dynamic (one
      # pair per credentialRef), so unlike every other variable below they
      # can't be listed as fixed keys in environment:. required: false so
      # `docker compose up` still works if you haven't created a root .env.
      - path: ../../.env
        required: false
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://postgres:5432/dms_core_db
      DB_USERNAME: dms_core_user
      DB_PASSWORD: ${DMS_CORE_DB_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: dms
      RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS}
      REDIS_HOST: redis
      # Office files are converted to PDF for the preview (DocumentRenditionService).
      PREVIEW_CONVERTER_URL: http://gotenberg:3000
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      KEYCLOAK_SERVER_URL: http://keycloak:8080
      KEYCLOAK_REALM: oak-dms
      KEYCLOAK_ISSUER_URI: http://${PUBLIC_HOST:-localhost}:8081/realms/oak-dms
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/oak-dms/protocol/openid-connect/certs
      KEYCLOAK_ADMIN_CLIENT_ID: dms-core-admin
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET}
      AUDIT_CORRELATION_SECRET: ${AUDIT_CORRELATION_SECRET}
      IMPERSONATION_SECRET: ${IMPERSONATION_SECRET}
      # dms-core's own SMTP client for PasswordResetService's reset-link
      # emails - shares the mailpit container with Keycloak's separate
      # SMTP config above, but is a distinct client (see application.yml's
      # spring.mail.* for why these aren't merged).
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
      FRONTEND_BASE_URL: http://${PUBLIC_HOST:-localhost}:3000
      CORS_ALLOWED_ORIGINS: http://${PUBLIC_HOST:-localhost}:3000
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      # Object storage (com.oak.dms.storage) - see docs/storage-architecture.md.
      # STORAGE_PROVIDER/S3_BUCKET/S3_ACCESS_KEY/S3_SECRET_KEY/S3_REGION/
      # S3_PATH_STYLE_ACCESS deliberately NOT listed here (same reasoning as
      # the seaweedfs service's SEAWEEDFS_S3_* comment above): an
      # environment: entry takes precedence over env_file for the same key,
      # and Compose's own ${...} substitution for environment: values never
      # reads the root .env - only env_file does. Left entirely to env_file
      # (root .env) - if unset there, application.yml's own defaults apply.
      #
      # S3_ENDPOINT is the one exception, hardcoded here on purpose - same
      # reasoning as DB_URL/RABBITMQ_HOST/REDIS_HOST above. The root .env's
      # S3_ENDPOINT (http://localhost:8333) is correct for host-side tools
      # (curl, SeaweedFsDocumentUploadIT) but wrong from inside this
      # container, where "localhost" means this container, not the
      # seaweedfs one. "seaweedfs" resolves via Compose's internal DNS.
      S3_ENDPOINT: http://seaweedfs:8333
      # Malware scanning (com.oak.dms.scanning) - see docs/scanning-architecture.md.
      # Staging (/data/dms/staging) and quarantine (/data/dms/quarantine)
      # default to FILE_SYSTEM on the same documents_data volume below, in
      # directories separate from /data/dms/documents.
      CLAMAV_HOST: clamav
      # Encryption at rest (com.oak.dms.encryption) - see docs/storage-architecture.md.
      # Locally the data keys are wrapped with a development key file on the
      # encryption_dev_keys volume below; set ENCRYPTION_PROVIDER=openbao plus
      # ENCRYPTION_OPENBAO_ADDR/ENCRYPTION_OPENBAO_TOKEN (root .env) to use a real OpenBao instead.
      # Production sets ENCRYPTION_REQUIRE_MANAGED_KEYS=true.
      ENCRYPTION_LOCAL_DEV_KEY_FILE: /var/lib/dms-encryption/local-dev-keys.json
      # A second copy outside Docker (repo/.dms-dev-keys, gitignored): restored
      # automatically if the encryption_dev_keys volume is ever lost.
      ENCRYPTION_LOCAL_DEV_BACKUP_FILE: /var/lib/dms-encryption-backup/local-dev-keys.json
    ports:
      - "8080:8080"
    volumes:
      # FILE_SYSTEM storage's default STORAGE_FILESYSTEM_BASE_PATH
      # (/data/dms/documents) - without this, that path only exists in the
      # container's writable layer, which the Dockerfile now pre-creates
      # and chowns to oakdms (see backend/Dockerfile) but which Docker
      # still initializes fresh on every recreated container. A named
      # volume here makes uploaded objects persist across `docker compose
      # up`/restarts, same as postgres_data/redis_data/seaweedfs_data below.
      - documents_data:/data
      # The development encryption key file. Losing this volume makes every
      # locally encrypted object unreadable - dms-core refuses to start
      # rather than quietly creating a new key once encrypted objects exist.
      - encryption_dev_keys:/var/lib/dms-encryption
      - ../../.dms-dev-keys:/var/lib/dms-encryption-backup
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak-bootstrap:
        condition: service_completed_successfully
      mailpit:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      clamav:
        condition: service_healthy

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile.dev
    container_name: oakdms-frontend
    # Memory ceiling. The Next.js DEV server (Turbopack) is by far the heaviest thing here - about
    # 2 GB after a few hours - and its memory only ever grows until restarted.
    # Uncapped it competes with the rest of the stack for the Docker VM's 7.8 GB,
    # which is what froze the VM earlier. A production build is far lighter
    # (typically ~150 MB, though not measured here).
    mem_limit: 3g
    environment:
      PORT: "3000"
      # Some Docker/OS combos (bind mounts on Windows/WSL2 or certain
      # network filesystems) don't propagate inotify file-change events
      # into the container, so Next's dev server never sees edits.
      # Polling fixes that at the cost of a bit of CPU; harmless if unneeded.
      WATCHPACK_POLLING: "true"
      # Read by lib/api-config.ts. These URLs are used by the BROWSER, so
      # they must be the public host, never a docker service name.
      NEXT_PUBLIC_API_BASE_URL: http://${PUBLIC_HOST:-localhost}:8080
      NEXT_PUBLIC_KEYCLOAK_ACCOUNT_URL: http://${PUBLIC_HOST:-localhost}:8081/realms/oak-dms/account
      # No NEXT_PUBLIC_GRAFANA_URL any more. The monitoring panels are
      # same-origin, served by this app's own /monitoring/panels/ route, so
      # the browser needs no Grafana address - and must not be given one.
      #
      # These two are SERVER-side only (no NEXT_PUBLIC_ prefix), read by
      # that route inside this container. Docker service names, deliberately:
      # the browser never resolves either of them.
      GRAFANA_INTERNAL_URL: http://grafana:3000
      DMS_CORE_INTERNAL_URL: http://dms-core:8080
    volumes:
      - ../../frontend:/app
      # Anonymous volume shadows the host's node_modules mount above with
      # the one installed *inside* the image at build time. Without this,
      # the bind mount would hide those deps entirely (or worse, replace
      # them with host-architecture binaries) - which is exactly the kind
      # of arch mismatch that caused the original "Exec format error".
      - /app/node_modules
      # Turbopack's dev cache. Anonymous volumes SURVIVE `docker compose up
      # --build`, so this one outlives the container that made it - and a
      # cache written before a route existed makes `next dev` answer 404 for
      # that route forever, with no error in the log and the page.tsx plainly
      # present in the container. If a route 404s but its file is there:
      #     docker compose up -d --force-recreate --renew-anon-volumes frontend
      - /app/.next
    ports:
      - "3000:3000"
    depends_on:
      - dms-core

  # ---------------------------------------------------------------------
  # Monitoring (Prometheus + Grafana). Config lives in infra/monitoring and
  # is shared with production - see its README. Everything here is additive:
  # no DMS service depends on any of it, so the stack runs exactly as before
  # if these are stopped.
  #
  #   docker compose stop prometheus grafana cadvisor node-exporter \
  #       postgres-exporter redis-exporter
  # ---------------------------------------------------------------------

  # Scrapes every target listed in infra/monitoring/prometheus/prometheus.yml
  # and evaluates the rules in alerts.yml.
  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: oakdms-prometheus
    restart: unless-stopped
    # Memory ceiling.
    mem_limit: 1g
    user: "nobody"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # 15 days locally: enough to look back over a sprint without the
      # volume growing unbounded on a developer machine.
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
      - --web.enable-lifecycle
      # Lets ${MONITORING_ENVIRONMENT} in prometheus.yml be substituted.
      - --enable-feature=expand-external-labels
    environment:
      MONITORING_ENVIRONMENT: ${MONITORING_ENVIRONMENT:-local}
      # Identifies this installation once client stacks forward their metrics
      # to a central Prometheus. "dev" locally; set per client in production.
      MONITORING_CLIENT: ${MONITORING_CLIENT:-dev}
    volumes:
      - ../monitoring/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 5

  # The dashboard itself. Embedded in the DMS admin UI (System Monitoring),
  # which is why anonymous Viewer access and embedding are turned on below -
  # see the security note in infra/monitoring/README.md before changing them.
  grafana:
    image: grafana/grafana:11.5.1
    container_name: oakdms-grafana
    restart: unless-stopped
    # Memory ceiling.
    mem_limit: 512m
    environment:
      # Admin login, for editing outside the embedded view. Local-only
      # default; production requires the variable to be set explicitly.
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      # Grafana lives UNDER THE DMS, at <app>/monitoring/panels/, and is
      # reached only through the frontend's proxy route
      # (frontend/app/monitoring/panels/[...path]/route.ts). Grafana builds
      # every asset and API URL from this root, so it has to be the public
      # path the browser uses - not Grafana's own host and port.
      #
      # Two things follow. The browser never loads a URL with "grafana" in
      # it, and - the part that matters - Grafana is no longer something a
      # browser talks to directly at all.
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://${PUBLIC_HOST:-localhost}:3000/monitoring/panels/}
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      # The panels are framed by the DMS monitoring page. Same-origin now,
      # since they are served from the app's own path.
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_SECURITY_COOKIE_SAMESITE: lax

      # Auth proxy: the DMS decides who the caller is, Grafana trusts the
      # name it is handed in X-WEBAUTH-USER.
      #
      # This is what replaced anonymous access. An iframe cannot be asked
      # for a second login, so the old page had Grafana serve panels to
      # whoever asked - which meant the DMS page was platform-admin only
      # while the metrics inside it were readable by anyone who could reach
      # Grafana's port. Now the proxy route asks dms-core
      # (/api/v1/monitoring/panel-auth, PLATFORM_ADMIN) and only then
      # forwards, with the caller's username attached.
      #
      # The header is only as trustworthy as the set of callers who can
      # send it. The proxy route strips any X-WEBAUTH-* a browser supplies,
      # and in production Grafana publishes no port at all. On this dev
      # machine port 3001 is still open for convenience, so anything on
      # your own localhost could set the header - acceptable here, and the
      # reason the production file does not do it.
      GF_AUTH_PROXY_ENABLED: "true"
      GF_AUTH_PROXY_HEADER_NAME: X-WEBAUTH-USER
      GF_AUTH_PROXY_HEADER_PROPERTY: username
      # Creates the Grafana user on first sight. They are all PLATFORM_ADMIN
      # on the DMS side; inside Grafana they only ever need to read, and
      # dashboards are provisioned from infra/monitoring as code anyway.
      GF_AUTH_PROXY_AUTO_SIGN_UP: "true"
      GF_AUTH_PROXY_SYNC_TTL: "60"
      GF_USERS_AUTO_ASSIGN_ORG_ROLE: Viewer
      # Anonymous access is now OFF.
      #
      # It was on because the old System Monitoring page framed a Grafana
      # dashboard, and an iframe cannot ask for a second login - so Grafana
      # had to serve the panels to whoever asked. The effect was that the
      # DMS page was platform-admin only while the metrics inside it were
      # readable by anyone who could reach Grafana's port, which is not the
      # same thing at all.
      #
      # That page now reads Prometheus through dms-core
      # (/api/v1/monitoring/*), behind the same PLATFORM_ADMIN check as
      # every other cross-tenant screen, so nothing needs anonymous any
      # more. The "Full dashboard" link still works - it asks for a Grafana
      # login, which is the correct behaviour for a separate tool.
      #
      # Set GRAFANA_ANONYMOUS_ENABLED=true to put it back.
      GF_AUTH_ANONYMOUS_ENABLED: ${GRAFANA_ANONYMOUS_ENABLED:-false}
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_ANONYMOUS_ORG_NAME: "Main Org."
      # Nothing to gain from the sign-up/"welcome" furniture in an embed.
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    # 3001 because 3000 is the DMS frontend; Grafana still listens on 3000
    # inside its own container.
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/monitoring/panels/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5

  # Reachability probes for the services that expose no metrics of their own
  # (Keycloak, SeaweedFS, Gotenberg, ClamAV, Mailpit, the frontend). Without
  # this, "is it up?" is only answerable for the handful that have exporters
  # - and the ones that do not are exactly the ones whose failure leaves the
  # DMS looking healthy while uploads or sign-in quietly stop working.
  blackbox:
    image: prom/blackbox-exporter:v0.25.0
    container_name: oakdms-blackbox
    restart: unless-stopped
    mem_limit: 128m
    command:
      - --config.file=/etc/blackbox/blackbox.yml
    volumes:
      - ../monitoring/blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    # Internal only. It can reach every service on this network, which is
    # the whole point and also why it is not published.
    expose:
      - "9115"

  # Log storage, the counterpart to Prometheus. Queried by dms-core for the
  # System Monitoring screen's per-service logs; never published.
  loki:
    image: grafana/loki:3.3.2
    container_name: oakdms-loki
    restart: unless-stopped
    mem_limit: 512m
    command: ["-config.file=/etc/loki/loki-config.yml"]
    volumes:
      - ../monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    expose:
      - "3100"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3100/ready | grep -q ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 45s

  # Ships every container's logs into Loki. Reads the Docker socket for
  # discovery - read-only, and into a log shipper rather than into the
  # application container. See infra/monitoring/promtail/promtail-config.yml.
  promtail:
    image: grafana/promtail:3.3.2
    container_name: oakdms-promtail
    restart: unless-stopped
    mem_limit: 256m
    command: ["-config.file=/etc/promtail/promtail-config.yml"]
    volumes:
      - ../monitoring/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail_positions:/tmp
    # Wait for Loki to be READY, not merely started. A bare depends_on only
    # orders the start; Promtail then tried to push before Loki could
    # resolve, logged a batch error, and sat in retry backoff - so nothing
    # arrived until it was restarted by hand.
    depends_on:
      loki:
        condition: service_healthy

  # Delivers what Prometheus's alert rules fire. Without it a rule could fire
  # and nobody would be told - the monitoring screen shows it, but only to
  # someone already looking. Reuses the SMTP relay the rest of the stack
  # sends mail through; the only new setting is WHO receives it.
  alertmanager:
    image: prom/alertmanager:v0.28.0
    container_name: oakdms-alertmanager
    restart: unless-stopped
    mem_limit: 128m
    # Rendered from a template at start (the relay differs per client, and
    # Alertmanager cannot read the environment itself). Run through sh, so the
    # script needs no execute bit.
    entrypoint: ["/bin/sh", "/etc/alertmanager/entrypoint.sh"]
    environment:
      # Mailpit catches everything locally, so a default recipient is safe
      # here and lets a developer see what an alert email looks like.
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-alerts@oakdms.local}
      ALERT_SMTP_HOST: ${ALERT_SMTP_HOST:-mailpit}
      ALERT_SMTP_PORT: ${ALERT_SMTP_PORT:-1025}
      ALERT_SMTP_FROM: ${ALERT_SMTP_FROM:-alerts@oakdms.local}
      # Shown in the email as a link to the monitoring screen. Optional - the
      # stack does not know its own public address, so it is not guessed.
      ALERT_LINK: ${ALERT_LINK:-}
    volumes:
      - ../monitoring/alertmanager:/etc/alertmanager:ro
      - alertmanager_data:/alertmanager
    expose:
      - "9093"

  # Host CPU, RAM, disk, disk I/O, network, uptime. Under Docker Desktop
  # this reports the Linux VM, not Windows - fine for spotting a container
  # eating the machine, but the disk figures are the VM's.
  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: oakdms-node-exporter
    restart: unless-stopped
    # Memory ceiling.
    mem_limit: 64m
    command:
      - --path.rootfs=/host
      # Container and virtual filesystems would otherwise swamp the real ones.
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc|rootfs/var/lib/docker)($$|/)
    pid: host
    volumes:
      # Plain :ro, not the :ro,rslave the node-exporter docs give for Linux -
      # Docker Desktop's VM refuses that ("path / is mounted on / but it is
      # not a shared or slave mount"). The production file, on a real Linux
      # host, does use rslave so later mounts stay visible.
      - /:/host:ro
    expose:
      - "9100"

  # Per-container CPU, memory, network and restart counts.
  #
  # KNOWN GAP on Docker Desktop (Windows/macOS): its storage driver is
  # "overlayfs", whose layer database cAdvisor cannot read, so it never
  # resolves a container NAME and the dashboard's Containers row stays empty.
  # Verified with and without the /var/lib/docker mount below. The production
  # server uses overlay2, where this works. `docker stats` is the local
  # substitute. See infra/monitoring/README.md.
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    container_name: oakdms-cadvisor
    restart: unless-stopped
    command:
      # Without this, cAdvisor also tracks every non-Docker cgroup on the
      # host and, more importantly, reports series with only an `id` label.
      # The dashboard groups containers by `name`, so series without one are
      # invisible - which looks like "cAdvisor is down" rather than
      # "cAdvisor can't read Docker".
      - --docker_only=true
      - --housekeeping_interval=15s
      - --store_container_labels=false
    # Reads the Docker socket to name containers. Read-only, and cAdvisor
    # only ever queries it - but it is still the Docker API, so this service
    # is never published beyond the host.
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      # Explicit, not just via /var/run above: on Docker Desktop the socket
      # is the only way cAdvisor can map a cgroup to a container name.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    devices:
      - /dev/kmsg
    expose:
      - "8080"
    # cAdvisor samples every container constantly; left alone it is often the
    # heaviest thing in a small stack.
    mem_limit: 512m

  # PostgreSQL availability, connections, transactions and database sizes.
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    container_name: oakdms-postgres-exporter
    restart: unless-stopped
    # Memory ceiling.
    mem_limit: 128m
    <<: *secrets-env
    environment:
      # Reads the same superuser the stack already uses locally. In
      # production this is a dedicated read-only role - see the production
      # compose file and infra/monitoring/README.md.
      DATA_SOURCE_NAME: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/postgres?sslmode=disable
      PG_EXPORTER_EXCLUDE_DATABASES: template0,template1
    expose:
      - "9187"
    depends_on:
      postgres:
        condition: service_healthy

  # Redis memory, connections, hit/miss rate and command rate.
  redis-exporter:
    image: oliver006/redis_exporter:v1.67.0
    container_name: oakdms-redis-exporter
    restart: unless-stopped
    # Memory ceiling.
    mem_limit: 64m
    environment:
      REDIS_ADDR: redis://redis:6379
      # The local redis runs with --requirepass too (see the redis service);
      # without this the exporter only ever reports redis_up 0 with NOAUTH.
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    expose:
      - "9121"
    depends_on:
      redis:
        condition: service_healthy

volumes:
  alertmanager_data:
  loki_data:
  promtail_positions:
  encryption_dev_keys:
  prometheus_data:
  grafana_data:
  postgres_data:
  redis_data:
  seaweedfs_data:
  documents_data:
  clamav_db:
