# Local development stack for dms-core. Production topology (Helm/RKE2/
# Rancher, managed Postgres with Barman backups, Ceph/Rook object storage,
# OpenBao secrets) lives under the other infra/ subdirectories - this
# compose file is intentionally dev-only.
#
# Secrets: nothing below is hardcoded plaintext. Values come from
# infra/secrets/dms-core.secrets.env, which is generated on demand by:
#     scripts/openbao-decrypt-secrets.sh
# from the committed ciphertext in infra/secrets/dms-core.secrets.enc.env
# (encrypted with OpenBao's Transit engine - see scripts/openbao-encrypt-secrets.sh).
# The plaintext file is gitignored and should be deleted after `docker compose up`.

x-secrets-env: &secrets-env
  env_file:
    - ../secrets/dms-core.secrets.env

services:
  postgres:
    image: postgres:18-alpine
    container_name: oakdms-postgres
    <<: *secrets-env
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: oakdms-rabbitmq
    <<: *secrets-env
    environment:
      RABBITMQ_DEFAULT_USER: dms
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - "5672:5672" # AMQP
      - "15672:15672" # management UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: oakdms-redis
    <<: *secrets-env
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Local dev-only fake mail server: catches every email Keycloak sends
  # (verify-email, password reset) instead of trying to deliver it
  # anywhere real. Web UI at http://localhost:8026 to actually read them -
  # this is why account-creation/reset-password emails never arrived
  # before: nothing was listening on the SMTP port Keycloak was
  # configured to use. Do NOT point production Keycloak's smtpServer at
  # this container - swap in a real SMTP relay/provider for that.
  mailpit:
    image: axllent/mailpit:latest
    container_name: oakdms-mailpit
    ports:
      - "8026:8025" # web UI (8025 is taken locally by dms-core sometimes; keeping 8026 to avoid clashing)
      - "1026:1025" # SMTP - matches the realm's smtpServer.port below
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8025/api/v1/info"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    container_name: oakdms-keycloak
    command: ["start-dev", "--import-realm"]
    <<: *secrets-env
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak_db
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      # Keycloak needs to know its own externally-reachable address to build
      # links (e.g. the verify-email/update-password action link) that a
      # browser can actually open. Without this, it derives the link's host
      # from whatever Host header triggered the request - which for
      # execute-actions-email is dms-core/keycloak-bootstrap calling over
      # the internal docker network as "keycloak:8080", producing an
      # unreachable link. hostname-strict=false lets internal callers keep
      # using the "keycloak:8080" service name for the request itself; it
      # only stops KC_HOSTNAME from being used to reject those requests -
      # generated links always use KC_HOSTNAME regardless.
      KC_HOSTNAME: http://localhost:8081
      KC_HOSTNAME_STRICT: "false"
    ports:
      - "8081:8080"
    volumes:
      - ./keycloak/oak-dms-realm.json:/opt/keycloak/data/import/oak-dms-realm.json:ro
    depends_on:
      postgres:
        condition: service_healthy

  # One-shot init job: grants dms-core-admin's service account the
  # manage-users role, the one piece of setup a realm export can't express
  # (see infra/keycloak/README.md). Runs once per stack start and exits;
  # dms-core waits for it to complete successfully before starting, so
  # user-management calls never race against an ungranted permission.
  keycloak-bootstrap:
    image: alpine:latest
    container_name: oakdms-keycloak-bootstrap
    entrypoint: /bin/sh
    command: ["/bootstrap/bootstrap.sh"]
    <<: *secrets-env
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_BOOTSTRAP_ADMIN_USER: admin
      KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KEYCLOAK_REALM: oak-dms
      KEYCLOAK_ADMIN_CLIENT_ID: dms-core-admin
      # Re-applied on every bootstrap run - see bootstrap.sh's SMTP config
      # section for why this can't just live in oak-dms-realm.json alone.
      KEYCLOAK_SMTP_HOST: mailpit
      KEYCLOAK_SMTP_PORT: "1025"
      KEYCLOAK_SMTP_FROM: no-reply@oakdms.local
      KEYCLOAK_SMTP_FROM_DISPLAY_NAME: Oak DMS
      KEYCLOAK_SMTP_AUTH: "false"
      KEYCLOAK_SMTP_SSL: "false"
      KEYCLOAK_SMTP_STARTTLS: "false"
    volumes:
      - ../keycloak/bootstrap.sh:/bootstrap/bootstrap.sh:ro
    depends_on:
      keycloak:
        condition: service_started

  dms-core:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: oakdms-core
    <<: *secrets-env
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://postgres:5432/dms_core_db
      DB_USERNAME: dms_core_user
      DB_PASSWORD: ${DMS_CORE_DB_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: dms
      RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      KEYCLOAK_SERVER_URL: http://keycloak:8080
      KEYCLOAK_REALM: oak-dms
      KEYCLOAK_ISSUER_URI: http://localhost:8081/realms/oak-dms
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/oak-dms/protocol/openid-connect/certs
      KEYCLOAK_ADMIN_CLIENT_ID: dms-core-admin
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET}
      AUDIT_CORRELATION_SECRET: ${AUDIT_CORRELATION_SECRET}
      IMPERSONATION_SECRET: ${IMPERSONATION_SECRET}
      # dms-core's own SMTP client for PasswordResetService's reset-link
      # emails - shares the mailpit container with Keycloak's separate
      # SMTP config above, but is a distinct client (see application.yml's
      # spring.mail.* for why these aren't merged).
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
      FRONTEND_BASE_URL: http://localhost:3000
      # Document upload (com.oak.dms.document) writes here; ocr-worker
      # reads the same bucket/key back -- see MinioProperties.
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak-bootstrap:
        condition: service_completed_successfully
      mailpit:
        condition: service_healthy
      minio:
        condition: service_healthy
      ocr-worker:
        condition: service_healthy

  # New to this compose file: nothing in the local stack used object
  # storage before ocr-worker. storage_object_key values on
  # document_versions are expected to resolve against this bucket once a
  # real upload/scan pipeline exists; ocr-worker also writes its own output
  # bucket here. Production topology (Ceph/Rook) is a separate concern --
  # this is dev-only, same as postgres/rabbitmq above.
  minio:
    image: quay.io/minio/minio:latest # docker.io/minio/minio wasn't pullable in testing; quay.io is MinIO's other official mirror
    container_name: oakdms-minio
    <<: *secrets-env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # web console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  ocr-worker:
    build:
      context: ../../backend/workers/ocr-worker
      dockerfile: Dockerfile
    container_name: oakdms-ocr-worker
    # This process holds a Docling layout model + PaddleOCR det/rec models
    # in memory (CPU inference) -- restart on an OOM kill rather than
    # sitting exited, since a transient memory spike shouldn't take the
    # service down permanently. Verified this was needed: it was OOM-killed
    # (docker inspect's OOMKilled flag) during load testing.
    restart: unless-stopped
    # Real measured number, not a guess: docker stats sampled every 3s over
    # the full 50-upload Phase 1 run (368 samples, OCR_WORKER_PROCESSES=2)
    # peaked at 6.89 GiB (p95 5.77 GiB, median 4.60 GiB) -- see
    # docs/ocr/phase1-verification.md. 8704m == 8.5 GiB is that peak plus
    # ~25% headroom. Before this the container had HostConfig.Memory=0,
    # i.e. nothing bounded it at all, and it was OOM-killed by the HOST
    # during earlier load testing (the `restart:` above exists because of
    # that) -- a cgroup limit turns "the host runs out and the kernel picks
    # a victim" into "this one container is killed and restarted".
    #
    # Raising OCR_WORKER_PROCESSES raises this proportionally: each pool
    # worker holds its own Docling layout model + PaddleOCR det/rec models
    # resident (see README's OCR_WORKER_PROCESSES note), so ~3.4 GiB per
    # process plus a ~1.5 GiB shared/parent floor is the shape to budget by.
    mem_limit: 8704m
    # Own secrets file, not dms-core's: ocr-worker has no login of its own
    # and needs none of dms-core's secrets directly (DB_URL/RABBITMQ_URL/
    # MINIO_* below are composed from infra/local/.env's values, resolved
    # by docker compose itself, not by this env_file) -- it only needs
    # INTERNAL_SERVICE_TOKEN, the defense-in-depth check on every request.
    env_file:
      - ../secrets/ocr-worker.secrets.env
    environment:
      DB_URL: postgresql+psycopg://dms_core_user:${DMS_CORE_DB_PASSWORD}@postgres:5432/dms_core_db
      RABBITMQ_URL: amqp://dms:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672/
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_SECURE: "false"
    # No `ports:` -- internal-only. ocr-worker is reachable from other containers on this compose
    # network at http://ocr-worker:8090 (Docker's own service-name DNS).
    # See README's "Auth & service exposure": frontend -> dms-core
    # (Keycloak-authenticated) -> ocr-worker (internal-only) is the only
    # intended path; dms-core's own passthrough routes are out of scope for
    # this service, so today the only caller on this network is whatever
    # runs scripts/dev/smoke_test_ocr.py.
    volumes:
      # PaddleOCR/PaddleX download their model weights to ~/.paddlex on
      # first use (tens of MB from huggingface.co) -- without this, every
      # `docker compose up`/container recreation re-downloads them from
      # scratch, which is slow and makes startup depend on that network
      # call succeeding every single time. Verified by watching a full
      # re-download happen after a plain container recreate.
      - ocr_worker_models:/home/oakdms/.paddlex
      # Same reasoning, for Docling's layout-analysis model (downloaded via
      # huggingface_hub's default cache dir).
      - ocr_worker_hf_cache:/home/oakdms/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile.dev
    container_name: oakdms-frontend
    environment:
      PORT: "3000"
      # Some Docker/OS combos (bind mounts on Windows/WSL2 or certain
      # network filesystems) don't propagate inotify file-change events
      # into the container, so Next's dev server never sees edits.
      # Polling fixes that at the cost of a bit of CPU; harmless if unneeded.
      WATCHPACK_POLLING: "true"
    volumes:
      - ../../frontend:/app
      # Anonymous volume shadows the host's node_modules mount above with
      # the one installed *inside* the image at build time. Without this,
      # the bind mount would hide those deps entirely (or worse, replace
      # them with host-architecture binaries) - which is exactly the kind
      # of arch mismatch that caused the original "Exec format error".
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    depends_on:
      - dms-core

volumes:
  postgres_data:
  redis_data:
  minio_data:
  ocr_worker_models:
  ocr_worker_hf_cache: