# Host nginx site for the DMS - the ONLY public entry point.
# Install: see docs/deployment.md ("Nginx"). Upstreams are the 127.0.0.1
# port bindings from infra/production/docker-compose.yml (nginx runs on the
# host, not in the compose network, so it can't resolve "dms-core" etc.).
#
#   /            -> frontend  (Next.js standalone, 127.0.0.1:3000)
#   /api/        -> dms-core  (127.0.0.1:8080, path kept: /api/v1/...)
#   /realms/     -> Keycloak  (email action links, account console, OIDC)
#   /resources/  -> Keycloak  (static assets for those pages)
#   /monitoring/panels/ -> Grafana, via the frontend route that authenticates first
#
# Deliberately NOT proxied: Keycloak /admin/ and management endpoints,
# dms-core /actuator and /swagger-ui, RabbitMQ/Mailpit UIs. Use SSH tunnels.
# No WebSockets or Server-Sent Events are used by the app (checked: no
# EventSource/WebSocket/SseEmitter anywhere), so no Upgrade handling.

upstream dms_frontend {
    server 127.0.0.1:3000;
    keepalive 16;
}

upstream dms_core {
    server 127.0.0.1:8080;
    keepalive 16;
}

upstream dms_keycloak {
    server 127.0.0.1:8081;
    keepalive 8;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 192.168.0.10 oak-app;

    server_tokens off;

    # Document uploads (POST /api/v1/documents, multipart). Note dms-core
    # itself still applies Spring's own multipart limits.
    # 0 = no limit, matching spring.servlet.multipart.max-request-size (-1):
    # files of any size are accepted, and ClamAV scans the ones over 2 GB in
    # segments.
    client_max_body_size 0;

    # Applied to every location below (none of them set its own
    # proxy_set_header, which would otherwise drop all of these).
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # OVERWRITE, never append ($proxy_add_x_forwarded_for): nginx is the edge,
    # and dms-core trusts the FIRST X-Forwarded-For entry for login rate
    # limiting and audit IPs (LoginAttemptLimiter). Appending would let a
    # client spoof that first entry.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;

    # Keycloak and Next can send large headers/cookies.
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    # Bulk import ZIP intake: dms-core answers only after unpacking the whole
    # ZIP (up to 20 GB) and staging every file in it, which can take far
    # longer than 120s. The upload itself is separate - a large ZIP arrives
    # in <= 64 MB chunks via /api/v1/upload-sessions, each its own short
    # request under the /api/ block. Regex locations win over the /api/
    # prefix, so only these two endpoints get the long timeout.
    location ~ ^/api/v1/bulk-imports/[^/]+/archive(/from-upload-session)?$ {
        proxy_pass http://dms_core;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
        proxy_request_buffering off;
    }

    # Single-file uploads of any size: the body takes a while to arrive on a slow
    # line, and dms-core answers once it has been staged and - up to 2 GB -
    # virus scanned (clamd needs ~1 min for 2 GB). Larger files are scanned in
    # the background, so the answer comes once they're staged; copying tens of
    # GB into staging still takes a while, hence the hour.
    location ~ ^/api/v1/(documents(/[^/]+/versions)?|bulk-imports(/[^/]+/files)?)$ {
        proxy_pass http://dms_core;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        client_body_timeout 300s;
        proxy_request_buffering off;
    }

    location /api/ {
        proxy_pass http://dms_core;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        # Stream large uploads straight through instead of spooling to disk.
        proxy_request_buffering off;
    }

    # dms-core's service-to-service routes (/internal/v1/ocr - ocr-worker
    # reading a document's plaintext) are never forwarded from outside.
    #
    # This block is belt and braces, not the only thing stopping it: nothing
    # above proxies /internal/ to dms_core, and the catch-all `location /`
    # below goes to the frontend, so an outside request already lands on
    # Next.js and 404s there. The rule is written out anyway because that is
    # an EMERGENT property of how the other blocks happen to be ordered - add
    # one `location /internal/` upstream by accident, or reorder these, and it
    # quietly stops being true. An explicit 444 cannot be lost that way, and
    # it states the intent for the next person reading this file.
    #
    # 444 (close without a response) rather than 404: there is nothing to say
    # to a caller asking for this from the internet.
    #
    # The endpoint does not rely on this. It requires a static service token
    # AND a signed per-job grant scoped to one version in one tenant, checks
    # the version's tenant against the grant, requires a live job, enforces
    # the scan gate and rate-limits - see docs/ocr/internal-endpoint.md and
    # OcrInternalContentControllerTest. This block means an attacker never
    # gets to attempt any of that.
    location /internal/ {
        return 444;
    }

    # No /grafana/ location any more, and that is the point.
    #
    # It used to proxy Grafana straight through, with anonymous viewing on so
    # the embedded dashboard needed no second login - which, as the comment
    # here used to admit, showed every metric to any visitor who could reach
    # this host.
    #
    # Monitoring panels are now served at /monitoring/panels/, which is an
    # ordinary app path: it falls through to the frontend like everything
    # else, and the frontend's route there checks the caller with dms-core
    # before forwarding anything to Grafana. Grafana publishes no port and
    # has no location of its own, so this file needs nothing for it.

    location /realms/ {
        proxy_pass http://dms_keycloak;
    }

    location /resources/ {
        proxy_pass http://dms_keycloak;
    }

    location / {
        proxy_pass http://dms_frontend;
    }
}
