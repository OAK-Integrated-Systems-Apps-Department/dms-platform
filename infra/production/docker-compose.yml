# Production stack for the single Ubuntu server (oak-app, 192.168.0.10).
# See docs/deployment.md for the full procedure.
#
# Differences from infra/local/docker-compose.yml (which stays dev-only):
#   - dms-core and frontend run PREBUILT images from GHCR, pinned to an
#     immutable tag (the git commit SHA) via IMAGE_TAG - the server never
#     builds anything.
#   - Nothing listens on a public interface. The host's own nginx is the only
#     public entry point (infra/production/nginx/dms.conf) and reaches the
#     three browser-facing services through 127.0.0.1 port bindings.
#     Postgres, Redis, RabbitMQ (AMQP) and SeaweedFS have no host ports at all.
#   - Keycloak runs in production mode (`start`, not `start-dev`).
#   - Every value comes from the server-side .env next to this file (Compose
#     reads it automatically for ${...} substitution). That file is NEVER
#     committed - start from .env.example. Secrets are passed to each service
#     explicitly below, not via a blanket env_file, so each container only
#     sees the secrets it actually needs.
#
# Relative paths below (../local/keycloak, ../keycloak) assume the repo
# layout is preserved on the server - the deploy workflow uploads exactly
# those files to $DEPLOY_PATH/infra/...

services:
  postgres:
    image: postgres:18-alpine
    container_name: oakdms-postgres
    restart: unless-stopped
    # Memory ceiling. Mostly page cache, which the kernel reclaims under pressure, so this is a
    # ceiling on a runaway query rather than a squeeze on normal work. 4g because the dashboard
    # and listing queries scan millions of rows (measured: 16 s of database time at 3.7M
    # documents) and have to run from memory, not disk.
    mem_limit: ${POSTGRES_MEM_LIMIT:-4g}
    # What Postgres is told it has - its defaults (128MB shared buffers, 4MB sort memory)
    # assume a small machine. Keep shared_buffers about a quarter of POSTGRES_MEM_LIMIT and
    # effective_cache_size about three quarters if you change the limit.
    command: ["postgres", "-c", "shared_buffers=${POSTGRES_SHARED_BUFFERS:-1GB}",
              "-c", "effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-3GB}",
              "-c", "work_mem=16MB", "-c", "maintenance_work_mem=256MB"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: postgres
      # Read only by init-multiple-dbs.sh, on the very first start.
      DMS_CORE_DB_PASSWORD: ${DMS_CORE_DB_PASSWORD:?DMS_CORE_DB_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./postgres/init-multiple-dbs.sh:/docker-entrypoint-initdb.d/init-multiple-dbs.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: oakdms-rabbitmq
    # RabbitMQ names its data directory after the node's hostname - pin it
    # so the rabbitmq_data volume is reused across container recreations.
    hostname: rabbitmq
    restart: unless-stopped
    # Memory ceiling. ~70 MB used idle. RabbitMQ blocks publishers at 40% of its limit, so this
    # leaves ~400 MB of backlog before that happens.
    mem_limit: 1g
    environment:
      RABBITMQ_DEFAULT_USER: dms
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?RABBITMQ_DEFAULT_PASS is required}
    ports:
      # Management UI only, localhost only - reach it with an SSH tunnel.
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: oakdms-redis
    restart: unless-stopped
    # Memory ceiling. ~15 MB used idle.
    mem_limit: 512m
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Catch-all SMTP sink, kept because the current deployment relies on it
  # (nothing else sends mail yet). Mail sent here is NOT delivered to anyone -
  # point SMTP_* in .env at a real relay for real delivery; this container can
  # then be left idle. UI is localhost-only (SSH tunnel).
  mailpit:
    image: axllent/mailpit:v1.27
    container_name: oakdms-mailpit
    restart: unless-stopped
    # Memory ceiling.
    mem_limit: 128m
    ports:
      - "127.0.0.1:8026:8025"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8025/api/v1/info"]
      interval: 10s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    container_name: oakdms-keycloak
    restart: unless-stopped
    # Memory ceiling. ~0.4 GB used idle.
    mem_limit: ${KEYCLOAK_MEM_LIMIT:-1536m}
    # Production mode. --import-realm only creates the realm if it does not
    # exist yet (IGNORE_EXISTING); keycloak-bootstrap below re-applies the
    # settings that must track this deployment (web client URLs, SMTP).
    command: ["start", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak_db
      # Keycloak connects as the postgres superuser (keycloak_db is owned by
      # it - see postgres/init-multiple-dbs.sh), so its password IS
      # POSTGRES_PASSWORD. Deriving it here, instead of a separate
      # KC_DB_PASSWORD that must be kept identical by hand, removes a way to
      # break Keycloak with a typo. (Least-privilege follow-up: a dedicated
      # keycloak DB user - see docs/deployment.md.)
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      # Only used the first time keycloak_db is initialised.
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD is required}
      # Plain HTTP behind nginx on the same host. Keycloak builds every
      # browser-facing link and the token issuer ("iss") from KC_HOSTNAME,
      # regardless of which host header a request arrived with - which is
      # why dms-core can call it internally as keycloak:8080 yet still
      # validate tokens against ${PUBLIC_URL}/realms/oak-dms.
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME: ${PUBLIC_URL:?PUBLIC_URL is required}
      KC_HOSTNAME_STRICT: "false"
      # nginx does NOT proxy /admin/, so the admin console is only reachable
      # through an SSH tunnel to the localhost port below.
      KC_HOSTNAME_ADMIN: http://localhost:8081
      KC_HEALTH_ENABLED: "true"
      # Substituted into oak-dms-realm.json on first import.
      OAK_DMS_WEB_URL: ${PUBLIC_URL}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:?KEYCLOAK_ADMIN_CLIENT_SECRET is required}
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - ../local/keycloak/oak-dms-realm.json:/opt/keycloak/data/import/oak-dms-realm.json:ro
    healthcheck:
      # The image has no curl/wget; bash's /dev/tcp against the management
      # port's readiness endpoint.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"status": *"UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy

  # One-shot job, identical to the local one (same script): grants the
  # dms-core-admin service account its roles and re-applies SMTP settings and
  # the web client's redirect URIs / web origins on every deploy.
  keycloak-bootstrap:
    image: alpine:3.22
    container_name: oakdms-keycloak-bootstrap
    entrypoint: /bin/sh
    command: ["/bootstrap/bootstrap.sh"]
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_BOOTSTRAP_ADMIN_USER: admin
      KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KEYCLOAK_REALM: oak-dms
      KEYCLOAK_ADMIN_CLIENT_ID: dms-core-admin
      KEYCLOAK_WEB_CLIENT_ID: oak-dms-web
      KEYCLOAK_WEB_CLIENT_URL: ${PUBLIC_URL}
      # Platform superadmin. The realm file ships the account WITHOUT a
      # credential on purpose - it used to carry a committed one, which meant
      # every client's server had the same known platform-admin login.
      # bootstrap.sh sets this only when the account has no password yet, so
      # it is an install-time value, not a reset-on-every-deploy value.
      # Required: without it nobody can sign in as the platform administrator.
      KEYCLOAK_SUPERADMIN_USERNAME: ${KEYCLOAK_SUPERADMIN_USERNAME:-superadmin@gmail.com}
      KEYCLOAK_SUPERADMIN_PASSWORD: ${KEYCLOAK_SUPERADMIN_PASSWORD:?KEYCLOAK_SUPERADMIN_PASSWORD is required}
      # Left at true: whatever is typed into .env at install must be replaced
      # by the administrator at first login, so the installer's value is
      # never the lasting credential.
      KEYCLOAK_SUPERADMIN_PASSWORD_TEMPORARY: ${KEYCLOAK_SUPERADMIN_PASSWORD_TEMPORARY:-true}
      KEYCLOAK_SMTP_HOST: ${SMTP_HOST:-mailpit}
      KEYCLOAK_SMTP_PORT: ${SMTP_PORT:-1025}
      KEYCLOAK_SMTP_FROM: ${SMTP_FROM:-no-reply@oakdms.local}
      KEYCLOAK_SMTP_FROM_DISPLAY_NAME: ${SMTP_FROM_DISPLAY_NAME:-Oak DMS}
      KEYCLOAK_SMTP_AUTH: ${SMTP_AUTH:-false}
      KEYCLOAK_SMTP_USER: ${SMTP_USERNAME:-}
      KEYCLOAK_SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      KEYCLOAK_SMTP_SSL: ${SMTP_SSL:-false}
      KEYCLOAK_SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
    volumes:
      - ../keycloak/bootstrap.sh:/bootstrap/bootstrap.sh:ro
    depends_on:
      keycloak:
        condition: service_healthy

  # Optional S3-compatible store (see docs/storage-architecture.md). dms-core
  # defaults to STORAGE_PROVIDER=FILE_SYSTEM and only talks to this if a
  # StorageLocation points at it. Internal network only.
  seaweedfs:
    image: chrislusf/seaweedfs:3.97
    container_name: oakdms-seaweedfs
    restart: unless-stopped
    # Memory ceiling. ~85 MB used idle.
    mem_limit: 1g
    environment:
      SEAWEEDFS_S3_ACCESS_KEY: ${SEAWEEDFS_S3_ACCESS_KEY:?SEAWEEDFS_S3_ACCESS_KEY is required}
      SEAWEEDFS_S3_SECRET_KEY: ${SEAWEEDFS_S3_SECRET_KEY:?SEAWEEDFS_S3_SECRET_KEY is required}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        cat > /data/s3_config.json <<CONFIG
        {
          "identities": [
            {
              "name": "dms",
              "credentials": [
                {"accessKey": "$$SEAWEEDFS_S3_ACCESS_KEY", "secretKey": "$$SEAWEEDFS_S3_SECRET_KEY"}
              ],
              "actions": ["Read", "Write", "List", "Tagging", "Admin"]
            }
          ]
        }
        CONFIG
        exec weed server -dir=/data -s3 -s3.port=8333 -s3.config=/data/s3_config.json
    volumes:
      - seaweedfs_data:/data
    healthcheck:
      # 127.0.0.1, not localhost - see the same check in infra/local.
      test: ["CMD", "nc", "-z", "127.0.0.1", "8333"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Office previews: converts Word/PowerPoint/OpenDocument/RTF/Visio files to
  # PDF (LibreOffice inside Gotenberg) so they can be shown in the browser -
  # see dms-core's DocumentRenditionService. Internal only: no ports, and the
  # Chromium routes (which fetch URLs) are switched off; only dms-core calls it.
  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: oakdms-gotenberg
    restart: unless-stopped
    command:
      - gotenberg
      - --chromium-disable-routes=true
      - --api-timeout=90s
      - --libreoffice-auto-start=true
      - --log-level=warn
    # LibreOffice can use a lot of memory on a large or malformed file - cap it
    # so a bad upload can't starve the rest of the server. A conversion that
    # hits the limit fails (the preview says so); the container restarts.
    mem_limit: 2g
    cpus: 2
    pids_limit: 256
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    # Only on the internal "previews" network: LibreOffice can follow links
    # embedded in a document (remote images, OLE links), so the converter
    # must not reach the internet or anything else on the server.
    networks:
      - previews

  # Virus scanner for every upload (dms-core streams each file to clamd before it
  # becomes a document - see docs/scanning-architecture.md). Same image and
  # limits as infra/local; keep the two in step. No host port: only dms-core
  # talks to it, over the default network. It needs outbound HTTPS to
  # database.clamav.net for its signature updates (freshclam).
  clamav:
    image: clamav/clamav-debian:1.4.3
    container_name: oakdms-clamav
    restart: unless-stopped
    environment:
      FRESHCLAM_CHECKS: "12" # every 2 hours
      # Kept >= dms.scanning.clamav.segment-bytes (2000 MB). clamd scans at most
      # 2147483645 bytes of any one stream whatever MaxFileSize says, hence 2047M -
      # larger files arrive as several overlapping segments;
      # MaxScanSize is the total read from inside archives, so it stays higher; keep it
      # (and MaxFiles) equal to dms.scanning.clamav.archive-scan-bytes / -files - a ZIP
      # past either is unpacked by dms-core and sent to clamd file by file.
      CLAMD_CONF_StreamMaxLength: 2047M
      CLAMD_CONF_MaxFileSize: 2047M
      CLAMD_CONF_MaxScanSize: 4000M
      # Anything clamd can't finish (too many files, nested too deep, too big, too
      # slow) or can't open (a password-protected archive) is flagged, and dms-core
      # refuses it as unscannable - never passes it as clean. MaxScanTime matches
      # dms-core's 900 s scan timeout.
      CLAMD_CONF_AlertExceedsMax: "yes"
      CLAMD_CONF_AlertEncryptedArchive: "yes"
      CLAMD_CONF_MaxScanTime: "900000"
    volumes:
      # The signature database - persisted so a restart doesn't re-download
      # ~300MB of definitions before clamd can start.
      - clamav_db:/var/lib/clamav
    # Signatures take ~1.5 GB in memory, roughly double while a new set loads.
    mem_limit: 4g
    healthcheck:
      # The image's own check: PING -> PONG on 3310.
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 5
      # The first start downloads the full signature database before clamd
      # listens - several minutes on a fresh volume.
      start_period: 600s

  dms-core:
    image: ${DMS_CORE_IMAGE:-ghcr.io/oak-integrated-systems-apps-department/dms-core}:${IMAGE_TAG:?IMAGE_TAG is not set - deploy with ./deploy.sh <tag>}
    container_name: oakdms-core
    restart: unless-stopped
    # Memory ceiling. The JVM sizes its heap as 75% of THIS (MaxRAMPercentage in backend/Dockerfile),
    # so with no limit it meant 75% of the whole server. 2560m gives a ~1.9 GB heap
    # against ~0.4 GB used idle. Raise DMS_CORE_MEM_LIMIT for a client with very
    # large imports; the heap follows automatically.
    mem_limit: ${DMS_CORE_MEM_LIMIT:-2560m}
    # default: every other service; previews: the Office converter (Gotenberg) only.
    networks:
      - default
      - previews
    # Optional extra variables that can't be listed as fixed keys here, e.g.
    # the per-StorageLocation STORAGE_CRED_<REF>_* pairs or STORAGE_PROVIDER /
    # S3_* / AZURE_STORAGE_* - see .env.example at the repo root for names.
    env_file:
      - path: ./dms-core.env
        required: false
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:postgresql://postgres:5432/dms_core_db
      DB_USERNAME: dms_core_user
      DB_PASSWORD: ${DMS_CORE_DB_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USERNAME: dms
      RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS}
      REDIS_HOST: redis
      # Office files are converted to PDF for the preview (DocumentRenditionService).
      PREVIEW_CONVERTER_URL: http://gotenberg:3000
      # Every upload is virus scanned by clamd before it becomes a document.
      CLAMAV_HOST: clamav
      CLAMAV_PORT: "3310"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      KEYCLOAK_SERVER_URL: http://keycloak:8080
      KEYCLOAK_REALM: oak-dms
      KEYCLOAK_ISSUER_URI: ${PUBLIC_URL}/realms/oak-dms
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/oak-dms/protocol/openid-connect/certs
      KEYCLOAK_ADMIN_CLIENT_ID: dms-core-admin
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET}
      AUDIT_CORRELATION_SECRET: ${AUDIT_CORRELATION_SECRET:?AUDIT_CORRELATION_SECRET is required}
      IMPERSONATION_SECRET: ${IMPERSONATION_SECRET:?IMPERSONATION_SECRET is required}
      MAIL_HOST: ${SMTP_HOST:-mailpit}
      MAIL_PORT: ${SMTP_PORT:-1025}
      MAIL_USERNAME: ${SMTP_USERNAME:-}
      MAIL_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_SMTP_AUTH: ${SMTP_AUTH:-false}
      MAIL_SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      PASSWORD_RESET_MAIL_FROM: ${SMTP_FROM:-no-reply@oakdms.local}
      # Browser, frontend and API share one origin through nginx, so CORS is
      # never actually exercised - but keep the allow-list exact anyway.
      FRONTEND_BASE_URL: ${PUBLIC_URL}
      CORS_ALLOWED_ORIGINS: ${PUBLIC_URL}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      S3_ENDPOINT: http://seaweedfs:8333
      # Encryption at rest (com.oak.dms.encryption, Module DE) - data keys wrapped
      # by OpenBao Transit; the app refuses to start with anything less.
      # OFF until OpenBao is provisioned for it - see the "Encryption at rest"
      # runbook in docs/storage-architecture.md (Transit key + token policy,
      # ENCRYPTION_OPENBAO_TOKEN in the secret store and secret-keys.txt, ENCRYPTION_OPENBAO_ADDR
      # reachable from this container). Then set ENCRYPTION_ENABLED=true in
      # .env and run "Encrypt existing documents" on the key management screen.
      ENCRYPTION_ENABLED: ${ENCRYPTION_ENABLED:-false}
      ENCRYPTION_PROVIDER: openbao
      ENCRYPTION_REQUIRE_MANAGED_KEYS: "true"
      # Every unwrap must be logged by OpenBao's audit device (DE-NFR-006).
      ENCRYPTION_REQUIRE_AUDIT_DEVICE: "true"
      ENCRYPTION_OPENBAO_ADDR: ${ENCRYPTION_OPENBAO_ADDR:-}
      # AppRole: dms-core signs in, renews its token and signs in again itself.
      ENCRYPTION_OPENBAO_AUTH: approle
      ENCRYPTION_OPENBAO_ROLE_ID: ${ENCRYPTION_OPENBAO_ROLE_ID:-}
      ENCRYPTION_OPENBAO_SECRET_ID: ${ENCRYPTION_OPENBAO_SECRET_ID:-}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - documents_data:/data
    # Health: the image's own HEALTHCHECK (backend/Dockerfile, /actuator/health).
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak-bootstrap:
        condition: service_completed_successfully
      mailpit:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      # Started, not healthy: on a fresh volume clamd needs minutes to download
      # its signatures. Uploads made meanwhile wait (pending) and are scanned
      # automatically once it answers - dms-core retries, it never skips the scan.
      clamav:
        condition: service_started

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/oak-integrated-systems-apps-department/dms-frontend}:${IMAGE_TAG:?IMAGE_TAG is not set - deploy with ./deploy.sh <tag>}
    container_name: oakdms-frontend
    restart: unless-stopped
    # Memory ceiling. A standalone Next.js server, which typically idles well under
    # 200 MB - an expectation, NOT a measurement: only the dev server runs on the
    # machine this was sized on. Check `docker stats` after the first deploy.
    mem_limit: 512m
    # The API URL is baked into this image at build time as same-origin
    # "/api" (frontend/Dockerfile) - nothing host-specific to set here.
    ports:
      - "127.0.0.1:3000:3000"
    # Health: the image's own HEALTHCHECK (frontend/Dockerfile).
    depends_on:
      - dms-core

  # ---------------------------------------------------------------------
  # Monitoring (Prometheus + Grafana). Config is shared with infra/local and
  # lives in infra/monitoring - see its README.
  #
  # Nothing in the DMS depends on these, so stopping them degrades nothing;
  # and like every other service here, none is reachable from the network.
  # Grafana is published on 127.0.0.1 only and reaches the browser through
  # the host nginx at /grafana/ (infra/production/nginx/dms.conf); Prometheus
  # is not proxied at all - SSH tunnel to 9090 if you need the raw query UI.
  #
  # deploy.sh does NOT health-gate these (APP_SERVICES is dms-core and
  # frontend): a monitoring outage must never roll back a good release.
  # ---------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: oakdms-prometheus
    restart: unless-stopped
    # Memory ceiling. ~130 MB for ~14k series; this covers an order of magnitude more.
    mem_limit: 1g
    user: "nobody"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # 30d by default here (vs 15d locally). Raising it costs disk on the
      # same volume the documents live on - check free space first.
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}
      - --storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-8GB}
      - --web.enable-lifecycle
      - --enable-feature=expand-external-labels
    environment:
      MONITORING_ENVIRONMENT: ${MONITORING_ENVIRONMENT:-production}
      # This client's short name - the label that will separate them in the
      # central Prometheus later. Unique per client, and never changed after
      # the first deploy. .env.example ships it as a bare CHANGE_ME so
      # deploy.sh blocks until it is set; the fallback here only covers
      # running this file directly, outside deploy.sh.
      MONITORING_CLIENT: ${MONITORING_CLIENT:-unset}
    volumes:
      - ../monitoring/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    # No host port: only Grafana (same network) queries it. Add a
    # "127.0.0.1:9090:9090" binding temporarily if you need the query UI.
    expose:
      - "9090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:11.5.1
    container_name: oakdms-grafana
    restart: unless-stopped
    # Memory ceiling. ~200 MB used.
    mem_limit: 512m
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      # Required, no default: an admin password must never fall back to
      # something guessable on a server. deploy.sh refuses to run while any
      # CHANGE_ME remains in .env.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      # Public URL the browser uses, through the host nginx.
      # Grafana is served UNDER THE DMS now, at <app>/monitoring/panels/,
      # reached only through the frontend's authenticated proxy route. It
      # builds every asset URL from this root, so it must be the public path
      # the browser uses. nginx needs no /grafana/ location any more - the
      # path falls through to the frontend like every other app route.
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://192.168.0.10/monitoring/panels/}
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      # Embedded in the DMS admin UI - see the local file and the README for
      # why anonymous Viewer access is acceptable here and what would make it
      # unacceptable (publishing Grafana beyond this host).
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_SECURITY_COOKIE_SAMESITE: lax
      # Defaults to OFF - see the long note in infra/local/docker-compose.yml.
      # The System Monitoring page reads Prometheus through dms-core now, so
      # nothing needs Grafana to serve metrics without a login. Set
      # GRAFANA_ANONYMOUS_ENABLED=true only if you deliberately want that.
      GF_AUTH_ANONYMOUS_ENABLED: ${GRAFANA_ANONYMOUS_ENABLED:-false}
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_ANONYMOUS_ORG_NAME: "Main Org."
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    # No published port, deliberately. Grafana trusts the X-WEBAUTH-USER
    # header (auth proxy), so anything that can reach it directly can be
    # whoever it likes. The frontend container is the only thing that needs
    # to, and it does so over the compose network - so the port is not
    # published at all here, unlike the dev file where 3001 stays open for
    # convenience. To look at Grafana on the server, tunnel to it:
    #   ssh -L 3001:localhost:3001 <host>   (after temporarily adding a port)
    # or read the dashboards as code in infra/monitoring.
    expose:
      - "3000"
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/monitoring/panels/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5

  # Reachability probes for the services that expose no metrics of their own
  # (Keycloak, SeaweedFS, Gotenberg, ClamAV, Mailpit, the frontend). Without
  # this, "is it up?" is only answerable for the handful that have exporters
  # - and the ones that do not are exactly the ones whose failure leaves the
  # DMS looking healthy while uploads or sign-in quietly stop working.
  blackbox:
    image: prom/blackbox-exporter:v0.25.0
    container_name: oakdms-blackbox
    restart: unless-stopped
    mem_limit: 128m
    command:
      - --config.file=/etc/blackbox/blackbox.yml
    volumes:
      - ../monitoring/blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    # Internal only. It can reach every service on this network, which is
    # the whole point and also why it is not published.
    expose:
      - "9115"

  # Log storage, the counterpart to Prometheus. Queried by dms-core for the
  # System Monitoring screen's per-service logs; never published.
  loki:
    image: grafana/loki:3.3.2
    container_name: oakdms-loki
    restart: unless-stopped
    mem_limit: 512m
    command: ["-config.file=/etc/loki/loki-config.yml"]
    volumes:
      - ../monitoring/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    expose:
      - "3100"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3100/ready | grep -q ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 45s

  # Ships every container's logs into Loki. Reads the Docker socket for
  # discovery - read-only, and into a log shipper rather than into the
  # application container. See infra/monitoring/promtail/promtail-config.yml.
  promtail:
    image: grafana/promtail:3.3.2
    container_name: oakdms-promtail
    restart: unless-stopped
    mem_limit: 256m
    command: ["-config.file=/etc/promtail/promtail-config.yml"]
    volumes:
      - ../monitoring/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - promtail_positions:/tmp
    # Wait for Loki to be READY, not merely started. A bare depends_on only
    # orders the start; Promtail then tried to push before Loki could
    # resolve, logged a batch error, and sat in retry backoff - so nothing
    # arrived until it was restarted by hand.
    depends_on:
      loki:
        condition: service_healthy

  # Delivers what Prometheus's alert rules fire. Without it a rule could fire
  # and nobody would be told - the monitoring screen shows it, but only to
  # someone already looking. Reuses the SMTP relay the rest of the stack
  # sends mail through; the only new setting is WHO receives it.
  alertmanager:
    image: prom/alertmanager:v0.28.0
    container_name: oakdms-alertmanager
    restart: unless-stopped
    mem_limit: 128m
    # Rendered from a template at start (the relay differs per client, and
    # Alertmanager cannot read the environment itself). Run through sh, so the
    # script needs no execute bit.
    entrypoint: ["/bin/sh", "/etc/alertmanager/entrypoint.sh"]
    environment:
      # Empty by default: a production stack sends no alert email until it is
      # told where. Set ALERT_EMAIL_TO in infra/production/.env - one address,
      # or several separated by commas. The relay itself is the same SMTP_*
      # the rest of the stack already uses, so there is nothing else to set.
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
      ALERT_SMTP_HOST: ${SMTP_HOST:-mailpit}
      ALERT_SMTP_PORT: ${SMTP_PORT:-1025}
      ALERT_SMTP_FROM: ${SMTP_FROM:-no-reply@oakdms.local}
      ALERT_SMTP_USERNAME: ${SMTP_USERNAME:-}
      ALERT_SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      ALERT_SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      # Shown in the email as a link to the monitoring screen. Optional - the
      # stack does not know its own public address, so it is not guessed.
      ALERT_LINK: ${ALERT_LINK:-}
    volumes:
      - ../monitoring/alertmanager:/etc/alertmanager:ro
      - alertmanager_data:/alertmanager
    expose:
      - "9093"

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: oakdms-node-exporter
    restart: unless-stopped
    # Memory ceiling.
    mem_limit: 64m
    command:
      - --path.rootfs=/host
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc|rootfs/var/lib/docker)($$|/)
    pid: host
    volumes:
      # rslave here (unlike infra/local): on a real Linux host this keeps
      # filesystems mounted after the container started visible to it.
      - /:/host:ro,rslave
    expose:
      - "9100"

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    container_name: oakdms-cadvisor
    restart: unless-stopped
    command:
      # Docker containers only, and keep the `name` label the dashboard
      # groups by - see the note in infra/local/docker-compose.yml.
      - --docker_only=true
      - --housekeeping_interval=15s
      - --store_container_labels=false
    # Mounts the Docker socket read-only to name containers. That is still
    # the Docker API, so this is never published - expose: only.
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    privileged: true
    devices:
      - /dev/kmsg
    expose:
      - "8080"
    mem_limit: 512m

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    container_name: oakdms-postgres-exporter
    restart: unless-stopped
    # Memory ceiling.
    mem_limit: 128m
    environment:
      # A dedicated read-only login, NOT the superuser the local stack uses:
      # this container only ever reads pg_stat_*, and a metrics exporter is
      # the wrong place to hold write access. Create it once with:
      #   CREATE ROLE dms_metrics LOGIN PASSWORD '...';
      #   GRANT pg_monitor TO dms_metrics;
      DATA_SOURCE_NAME: postgresql://${POSTGRES_METRICS_USER:-dms_metrics}:${POSTGRES_METRICS_PASSWORD:?POSTGRES_METRICS_PASSWORD is required}@postgres:5432/postgres?sslmode=disable
      PG_EXPORTER_EXCLUDE_DATABASES: template0,template1
    expose:
      - "9187"
    depends_on:
      postgres:
        condition: service_healthy

  redis-exporter:
    image: oliver006/redis_exporter:v1.67.0
    container_name: oakdms-redis-exporter
    restart: unless-stopped
    # Memory ceiling.
    mem_limit: 64m
    environment:
      REDIS_ADDR: redis://redis:6379
      # Production Redis requires a password (see the redis service above).
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    expose:
      - "9121"
    depends_on:
      redis:
        condition: service_healthy

networks:
  # internal: true - no gateway out. Only dms-core and the converter are on it.
  previews:
    internal: true

volumes:
  alertmanager_data:
  loki_data:
  promtail_positions:
  # Same volume keys as infra/local, so a server that was started from the
  # local compose file keeps its data when COMPOSE_PROJECT_NAME matches -
  # see docs/deployment.md "Existing data".
  postgres_data:
  redis_data:
  rabbitmq_data:
  seaweedfs_data:
  documents_data:
  clamav_db:
  # Metrics history and Grafana's own state (users, preferences). The
  # dashboards themselves are provisioned from disk, so losing this volume
  # costs history, not configuration.
  prometheus_data:
  grafana_data:
